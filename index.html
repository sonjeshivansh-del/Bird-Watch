<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bird Watch</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f8f2;--card:#fff;--text:#18241a;--muted:#5a6b5c;--primary:#2e7d32;--chip:#e1eee0;--border:#d3dfd1;--warn:#c62828;--good:#2e7d32;--land:#dcebd7;--water:#bfe0ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101610;--card:#192119;--text:#e5ede5;--muted:#9db09e;--primary:#81c784;--chip:#243126;--border:#2d3b2f;--warn:#ef9a9a;--good:#81c784;--land:#22301f;--water:#1d3a46}}
:root[data-theme="dark"]{--bg:#101610;--card:#192119;--text:#e5ede5;--muted:#9db09e;--primary:#81c784;--chip:#243126;--border:#2d3b2f;--warn:#ef9a9a;--good:#81c784;--land:#22301f;--water:#1d3a46}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding-bottom:76px}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.1rem;margin:0 0 8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:.75rem;background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:4px 10px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:12px}
select,button,input{font:inherit;color:inherit}
select,input{padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);max-width:100%}
input{width:100%;margin-bottom:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{border:1px solid var(--border);background:var(--chip);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;min-height:40px}
.chip.on{background:var(--primary);color:var(--bg);border-color:var(--primary)}
.btn{background:var(--primary);color:var(--bg);border:0;border-radius:12px;padding:12px 18px;cursor:pointer;min-height:44px;font-weight:600}
.btn.alt{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.sm{min-height:36px;padding:6px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.15rem}.stat span{font-size:.78rem;color:var(--muted)}
.up{color:var(--good)}.down{color:var(--warn)}
svg{width:100%;height:auto;display:block}
.scroll{overflow-x:auto}
#map{touch-action:none;cursor:grab;border-radius:12px;background:#0c2f5a;user-select:none}
#map text{font-family:system-ui,sans-serif}
.alert{border-left:5px solid var(--warn);padding-left:12px}.alert.ok{border-color:var(--good)}
.muted{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.log{border-top:1px solid var(--border);padding:8px 0}
.err{color:var(--warn);margin:0 0 8px}
pre{background:var(--chip);border-radius:10px;padding:10px;overflow-x:auto;font-size:.8rem}
.auth{max-width:380px;margin:8vh auto 0}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translateY(-10px) scale(.97)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.enter{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
.leave{animation:fadeOut .3s ease-in both}
#nav.enter{animation-name:slideUp}
@media (prefers-reduced-motion:reduce){.enter,.leave{animation:none}}
fieldset{border:1px solid var(--border);border-radius:12px;margin:0 0 8px;padding:8px 12px}
legend{padding:0 6px}
.radios label{display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer}
input[type=radio]{width:auto;margin:0}
code{background:var(--chip);border-radius:6px;padding:1px 5px;font-size:.85em}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes ripple{from{transform:scale(1);opacity:.6}to{transform:scale(3.4);opacity:0}}
.me-dot{animation:blink 1.1s ease-in-out infinite}
.me-ring{transform-box:fill-box;transform-origin:center;animation:ripple 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.me-dot,.me-ring{animation:none}}
#sheetwrap[hidden],#namewrap[hidden]{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
.sheet{position:fixed;z-index:51;left:0;right:0;margin:0 auto;top:max(10vh,env(safe-area-inset-top,0px));width:min(92vw,420px);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:fadeUp .25s ease both}
.switch{display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer}
.switch input{width:20px;height:20px;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:12px 4px;cursor:pointer;color:var(--muted);min-height:56px}
nav button.on{color:var(--primary);font-weight:700}
</style>
</head>
<body>
<main>
<header><h1>🐦 Bird Watch</h1><span class="badge" id="net" role="status"></span><div class="row" id="who"></div></header>
<div id="app"><p class="muted">Loading database…</p></div>
</main>
<nav id="nav" hidden>
<button data-tab="map">Live map</button><button data-tab="trends">Trends</button>
<button data-tab="alerts">Alerts</button><button data-tab="device">Device</button>
</nav>
<script>
// ================= SAMPLE DATABASE (IndexedDB; in-memory fallback) =================
const KEYS={users:"email",species:"id",units:"id",daily:"k",hourly:"k",detections:"id"};
const DB={idb:null,mem:{},
 async open(){
  for(const s in KEYS)this.mem[s]=new Map();
  try{this.idb=await new Promise((res,rej)=>{const r=indexedDB.open("birdwatch",1);
   r.onupgradeneeded=()=>{for(const s in KEYS)r.result.createObjectStore(s,{keyPath:KEYS[s]})};
   r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.idb=null}
 },
 req(s,mode,fn){return new Promise((res,rej)=>{const t=this.idb.transaction(s,mode);let rq;
  try{rq=fn(t.objectStore(s))}catch(e){rej(e);return}t.oncomplete=()=>res(rq?rq.result:undefined);t.onerror=()=>rej(t.error)})},
 async all(s){if(!this.idb)return[...this.mem[s].values()];return this.req(s,"readonly",o=>o.getAll())},
 async get(s,k){if(!this.idb)return this.mem[s].get(k);return this.req(s,"readonly",o=>o.get(k))},
 async range(s,lo,hi){if(!this.idb)return[...this.mem[s].entries()].filter(([k])=>k>=lo&&k<=hi).map(e=>e[1]);
  return this.req(s,"readonly",o=>o.getAll(IDBKeyRange.bound(lo,hi)))},
 async putMany(s,rows){if(!this.idb){rows.forEach(r=>this.mem[s].set(r[KEYS[s]],r));return}
  return this.req(s,"readwrite",o=>{rows.forEach(r=>o.put(r))})},
 async clear(s){if(!this.idb){this.mem[s].clear();return}return this.req(s,"readwrite",o=>o.clear())}
};
const SEED_SP=[
{id:"robin",name:"American Robin",color:"#e65100",b:220,g:.03},{id:"cardinal",name:"Northern Cardinal",color:"#c62828",b:140,g:.08},
{id:"mallard",name:"Mallard",color:"#2e7d32",b:180,g:-.05},{id:"heron",name:"Great Blue Heron",color:"#546e7a",b:40,g:-.16},
{id:"eagle",name:"Bald Eagle",color:"#5d4037",b:12,g:.18},{id:"hawk",name:"Red-tailed Hawk",color:"#8d6e63",b:25,g:.01},
{id:"wren",name:"Carolina Wren",color:"#f9a825",b:95,g:-.14}];
const UNITS=[{id:"A",name:"Unit A",lat:40.6168,lon:-73.8212},{id:"B",name:"Unit B",lat:40.6275,lon:-73.833},{id:"C",name:"Unit C",lat:40.6089,lon:-73.8441}]; // SAMPLE GPS positions
const p2=n=>String(n).padStart(2,"0");
const hex=x=>p2(x.toString(16));
const iso=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const prof=h=>.25+1.2*Math.exp(-Math.pow(h-6,2)/8)+.6*Math.exp(-Math.pow(h-18,2)/10);
async function hash(pw,salt){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+pw));return[...new Uint8Array(b)].map(hex).join("")}
async function seed(){
 const now=new Date(),today=iso(now);let last=null;try{last=localStorage.getItem("bw.seed")}catch(e){}
 if(!(await DB.get("users","demo@birdwatch.app"))){const salt="demo";
  await DB.putMany("users",[{email:"demo@birdwatch.app",name:"Demo Researcher",salt,hash:await hash("birdwatch123",salt)}])}
 const SEEDV=today+"|v3";if(last===SEEDV&&(await DB.all("species")).length)return;
 for(const s of["species","units","daily","hourly","detections"])await DB.clear(s);
 await DB.putMany("species",SEED_SP.map(({id,name,color})=>({id,name,color})));
 await DB.putMany("units",UNITS);
 const start=new Date(now.getFullYear()-9,0,1),total=Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-start)/864e5),daily=[],hourly=[];
 SEED_SP.forEach((s,i)=>{const r=rng(i*97+7);
  for(let d=0;d<=total;d++){const dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+d),key=iso(dt),t=d/total;
   const v=Math.max(1,Math.round(s.b*(1+s.g*(t-1))*(1+.15*Math.sin((dt.getMonth()-3)/12*2*Math.PI))*(1+(r()-.5)*.14)));
   daily.push({k:s.id+"|"+key,sp:s.id,date:key,count:v});
   if(total-d<7)for(let h=0,mx=total-d===0?now.getHours():23;h<=mx;h++)
    hourly.push({k:s.id+"|"+key+"|"+p2(h),sp:s.id,date:key,hour:h,count:Math.max(0,Math.round(v/15*prof(h)*(1+(r()-.5)*.3)))});
  }});
 await DB.putMany("daily",daily);await DB.putMany("hourly",hourly);
 const r=rng(5);
 await DB.putMany("detections",Array.from({length:14},(_,i)=>{const u=UNITS[i%3],sp=SEED_SP[Math.floor(r()*SEED_SP.length)],ts=Date.now()-i*240000;
  return{id:u.id+"|"+ts+"|"+sp.id,sp:sp.id,unit:u.id,ts,lat:+(u.lat+(r()-.5)*.0012).toFixed(6),lon:+(u.lon+(r()-.5)*.0016).toFixed(6),acc:+(4+r()*8).toFixed(1),src:"gps"}}));
 try{localStorage.setItem("bw.seed",SEEDV)}catch(e){}
}
// ---- one detection event (from any device) -> database ----
const num=v=>typeof v==="number"&&isFinite(v);
async function ingest(ev){
 const [sps,us]=await Promise.all([DB.all("species"),DB.all("units")]),name=String(ev.species||"");
 let sp=sps.find(s=>s.id===name||s.name.toLowerCase()===name.toLowerCase());
 if(!sp){sp={id:name.toLowerCase().replace(/\W+/g,"-"),name,color:"#607d8b"};await DB.putMany("species",[sp])}
 const gps=num(ev.lat)&&num(ev.lon)&&Math.abs(ev.lat)<=90&&Math.abs(ev.lon)<=180;
 let u=us.find(x=>x.id===String(ev.unit)||x.rid===String(ev.unit)||x.name===ev.unit);
 if(!u){u={id:String(ev.unit),rid:String(ev.unit),name:String(ev.unit),lat:gps?ev.lat:null,lon:gps?ev.lon:null};await DB.putMany("units",[u]);
  if(!nameQ.some(q=>q.id===u.id)){const first=!nameQ.length;nameQ.push({id:u.id,isNew:true});if(first)nameDialog()}}
 else if(u.lat==null&&gps){u.lat=ev.lat;u.lon=ev.lon;await DB.putMany("units",[u])}
 const ts=ev.ts||Date.now(),id=u.id+"|"+ts+"|"+sp.id;
 if(await DB.get("detections",id))return;
 // exact position: the device's own GPS if sent, else the unit's fixed location, else none (never invented)
 const lat=gps?ev.lat:u.lat,lon=gps?ev.lon:u.lon;
 await DB.putMany("detections",[{id,sp:sp.id,unit:u.id,ts,lat,lon,acc:num(ev.acc)?ev.acc:null,src:gps?"gps":(lat==null?"none":"unit")}]);
 const d=new Date(ts),date=iso(d),hk=sp.id+"|"+date+"|"+p2(d.getHours()),dk=sp.id+"|"+date;
 const h=(await DB.get("hourly",hk))||{k:hk,sp:sp.id,date,hour:d.getHours(),count:0};h.count++;
 const dd=(await DB.get("daily",dk))||{k:dk,sp:sp.id,date,count:0};dd.count++;
 await DB.putMany("hourly",[h]);await DB.putMany("daily",[dd]);
}
// ================= queries =================
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const ha=h=>(h%12||12)+(h<12?" AM":" PM");
const pct=a=>a[0]?(a[a.length-1]-a[0])/a[0]*100:0;
const fp=p=>(p>=0?"+":"")+p.toFixed(1)+"%";
const RANGES={day:"Today",week:"Past week",month:"Past month",year:"Past year",decade:"10 years"};
async function hrs(sp,d){const by={};(await DB.range("hourly",sp+"|"+iso(d)+"|00",sp+"|"+iso(d)+"|23")).forEach(r=>by[r.hour]=r.count);return by}
function avgBy(rows,keyFn,keys){const g={};rows.forEach(r=>{const k=keyFn(r);(g[k]=g[k]||[]).push(r.count)});return keys.map(k=>g[k]?g[k].reduce((a,b)=>a+b,0)/g[k].length:0)}
async function seriesFor(sp,key){
 const now=new Date(),ago=n=>new Date(now.getFullYear(),now.getMonth(),now.getDate()-n);
 if(key==="day"){
  const [t,y]=await Promise.all([hrs(sp,ago(0)),hrs(sp,ago(1))]),n=now.getHours()+1;
  const pts=Array.from({length:n},(_,h)=>({x:h/23,v:t[h]||0})),ts=pts.reduce((a,p)=>a+p.v,0),ys=pts.reduce((a,_,h)=>a+(y[h]||0),0);
  return{pts,ticks:[0,3,6,9,12,15,18,21].map(h=>({x:h/23,l:ha(h)})),cap:"Detections per hour · x-axis is the time of day",latest:ts,ll:"Today so far",trend:ys?(ts-ys)/ys*100:0,tl:"vs. yesterday, same hours"};
 }
 if(key==="week"||key==="month"){
  const n=key==="week"?7:30,by={};
  (await DB.range("daily",sp+"|"+iso(ago(n-1)),sp+"|"+iso(ago(0)))).forEach(r=>by[r.date]=r.count);
  const vals=Array.from({length:n},(_,i)=>by[iso(ago(n-1-i))]||0);
  return{pts:vals.map((v,i)=>({x:i/(n-1),v})),cap:"Detections per day",latest:vals[n-1],ll:"Latest day",trend:pct(vals),tl:"over this period",
   ticks:vals.map((_,i)=>i).filter(i=>key==="week"||i%5===0||i===n-1).map(i=>({x:i/(n-1),l:key==="week"?WD[ago(n-1-i).getDay()]:ago(n-1-i).getDate()}))};
 }
 if(key==="year"){
  const ms=Array.from({length:12},(_,i)=>new Date(now.getFullYear(),now.getMonth()-11+i,1)),ks=ms.map(d=>d.getFullYear()+"-"+p2(d.getMonth()+1));
  const vals=avgBy(await DB.range("daily",sp+"|"+ks[0]+"-01",sp+"|~"),r=>r.date.slice(0,7),ks).map(Math.round);
  return{pts:vals.map((v,i)=>({x:i/11,v})),ticks:ms.map((d,i)=>({x:i/11,l:MN[d.getMonth()]})),cap:"Average detections per day, by month",latest:vals[11],ll:"This month (avg/day)",trend:pct(vals),tl:"over 12 months"};
 }
 const ys=Array.from({length:10},(_,i)=>String(now.getFullYear()-9+i));
 const vals=avgBy(await DB.range("daily",sp+"|",sp+"|~"),r=>r.date.slice(0,4),ys).map(Math.round);
 return{pts:vals.map((v,i)=>({x:i/9,v})),ticks:ys.map((l,i)=>({x:i/9,l})),cap:"Average detections per day, by year",latest:vals[9],ll:"This year (avg/day)",trend:pct(vals),tl:"over 10 years"};
}
async function decadeAll(sps){return Promise.all(sps.map(async s=>({s,p:(await seriesFor(s.id,"decade")).trend})))}
function habitat(ds){const a=ds.reduce((x,d)=>x+d.p,0)/(ds.length||1);return a>=0?["Excellent","up"]:a>=-5?["Good","up"]:a>=-10?["Fair","down"]:["Poor","down"]}
// ================= views =================
const S={tab:"map",sp:"robin",range:"week",sel:null,drag:false,v:null,md:null,entering:false,authAnim:true,me:null,showMe:false,locMsg:"",sat:true,tilesOK:null,user:null,authMode:"in",authErr:""};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=document.getElementById("app");
const lastEmail=()=>{try{return localStorage.getItem("bw.email")||""}catch(e){return""}};
function authView(){
 const up=S.authMode==="up";
 return `<div class="card auth"><h2>${up?"Create account":"Sign in"}</h2>
 <form id="authform" autocomplete="on">
 ${up?`<input id="a-name" placeholder="Your name" autocomplete="name" required>`:""}
 <input id="a-email" type="email" placeholder="Email" autocomplete="username" value="${esc(lastEmail())}" required>
 <input id="a-pw" type="password" placeholder="Password (6+ characters)" autocomplete="${up?"new-password":"current-password"}" required>
 ${up?`<fieldset class="radios"><legend><b>Are we allowed to use your location?</b></legend>
 <label><input type="radio" name="loc" value="yes" required> Yes, show where I am on the map</label>
 <label><input type="radio" name="loc" value="no"> No, don’t use my location</label>
 <p class="muted">Only used to show you on the map while the app is open. Your position isn’t saved.</p></fieldset>`:""}
 ${S.authErr?`<p class="err" role="alert">${esc(S.authErr)}</p>`:""}
 <div class="row"><button class="btn" type="submit">${up?"Create account":"Sign in"}</button>
 <button class="btn alt" type="button" data-auth="${up?"in":"up"}">${up?"I have an account":"Create account"}</button></div></form>
 <p class="muted" style="margin-top:12px">Demo account: demo@birdwatch.app / birdwatch123<br>Accounts live only in this browser’s sample database. Real sign-in needs a server.</p></div>`;
}
// ---------- real-coordinate map: Web Mercator + simplified continent outlines ----------

async function connectBle(){
 if(!navigator.bluetooth){DEV.msg="Web Bluetooth isn’t available here. Use Chrome or Edge on desktop or Android.";return}
 try{
  const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[NUS]});
  const srv=await dev.gatt.connect(),svc=await srv.getPrimaryService(NUS),ch=await svc.getCharacteristic(NUS_TX);
  let buf="";const dec=new TextDecoder();
  ch.addEventListener("characteristicvaluechanged",async e=>{buf+=dec.decode(e.target.value);let i;
   while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line){try{await ingest(JSON.parse(line))}catch(x){}}refresh()}});
  await ch.startNotifications();
  dev.addEventListener("gattserverdisconnected",()=>{if(DEV.ble!==dev)return;DEV.ble=null;DEV.on=false;DEV.msg="Bluetooth device disconnected";refresh()});
  DEV.ble=dev;DEV.on=true;DEV.msg="Connected: "+(dev.name||"Raspberry Pi 4")+" over Bluetooth";
 }catch(e){DEV.msg="Couldn’t connect over Bluetooth: "+(e.message||e)}

  while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line){try{await ingest(JSON.parse(line))}catch(e){}}refresh()}}}catch(e){}
}

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet)hideSheet()});
$.addEventListener("click",async e=>{
 const m=e.target.closest("[data-m]");if(m){S.sel=m.dataset.m;render();return}
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.r){S.range=d.r;render()}
 else if(d.auth){S.authMode=d.auth;S.authErr="";render()}
 else if("conn" in d){await connect();render()}
 else if("disc" in d)disconnect();
 else if(d.loc)await setConsent(d.loc==="yes");
 else if(d.rename){nameQ=[{id:d.rename,isNew:false}];await nameDialog()}
 else if(d.mz&&S.md){if(!S.v)fitView(true);
  if(d.mz==="in")zoomAt(MW/2,MH/2,1);else if(d.mz==="out")zoomAt(MW/2,MH/2,-1);
  else if(d.mz==="sel"){const m=S.md.dets.find(x=>x.id===S.sel);if(m&&m.lat!=null)setView(m.lon,m.lat,17)}
  else if(d.mz==="me"){locateMe();return}
  else if(d.mz==="sat"){S.sat=!S.sat;render();return}
  else fitView(d.mz==="world");
  drawMap()}
});
$.addEventListener("change",e=>{
 if(e.target.id==="sp"){S.sp=e.target.value;render()}
 if(e.target.id==="kind"){DEV.kind=e.target.value;render()}
});
$.addEventListener("input",e=>{if(e.target.id==="url")DEV.url=e.target.value});
// map gestures: drag to pan, wheel / pinch to zoom
const PTR=new Map();let raf=0;
const redraw=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;drawMap()})};
$.addEventListener("pointerdown",e=>{if(e.target.closest("#map")&&S.v)PTR.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY})});
$.addEventListener("pointermove",e=>{
 const s=document.getElementById("map"),p=PTR.get(e.pointerId);if(!s||!p)return;
 if(!S.drag){if(PTR.size===1&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<5)return;S.drag=true;try{s.setPointerCapture(e.pointerId)}catch(x){}}
 const r=s.getBoundingClientRect(),k=MW/r.width;
 if(PTR.size===2){const [a,b]=[...PTR.values()],d0=Math.hypot(a.x-b.x,a.y-b.y);p.x=e.clientX;p.y=e.clientY;
  const d1=Math.hypot(a.x-b.x,a.y-b.y);if(d0>0)zoomAt(((a.x+b.x)/2-r.left)*k,((a.y+b.y)/2-r.top)*k,Math.log2(d1/d0))}
 else{S.v.cx-=(e.clientX-p.x)*k/wpx();S.v.cy-=(e.clientY-p.y)*k/wpx();p.x=e.clientX;p.y=e.clientY;clampView()}
 redraw();
});
const endPtr=e=>{PTR.delete(e.pointerId);if(!PTR.size)setTimeout(()=>{S.drag=false;redraw()},60)};
$.addEventListener("pointerup",endPtr);$.addEventListener("pointercancel",endPtr);
$.addEventListener("wheel",e=>{const s=e.target.closest("#map");if(!s||!S.v)return;e.preventDefault();
 const r=s.getBoundingClientRect(),k=MW/r.width;zoomAt((e.clientX-r.left)*k,(e.clientY-r.top)*k,-e.deltaY*.002);redraw()},{passive:false});
$.addEventListener("submit",async e=>{
 e.preventDefault();if(e.target.id!=="authform")return;
 const email=document.getElementById("a-email").value.trim().toLowerCase(),pw=document.getElementById("a-pw").value;
 try{
  if(!crypto.subtle)throw new Error("nosec");
  if(S.authMode==="up"){
   const name=document.getElementById("a-name").value.trim();
   if(pw.length<6){S.authErr="Password must be at least 6 characters.";render();return}
   if(await DB.get("users",email)){S.authErr="That email already has an account.";render();return}
   const salt=Array.from(crypto.getRandomValues(new Uint8Array(8)),hex).join("");
   const lc=document.querySelector('input[name="loc"]:checked');const u={email,name:name||email,salt,hash:await hash(pw,salt),locConsent:!!lc&&lc.value==="yes"};await DB.putMany("users",[u]);S.user=u;
  }else{
   const u=await DB.get("users",email);
   if(!u||u.hash!==await hash(pw,u.salt)){S.authErr="Email or password is incorrect.";render();return}
   S.user=u;
  }
  try{localStorage.setItem("bw.session",email);localStorage.setItem("bw.email",email)}catch(x){}
  S.authErr="";await enterApp();
 }catch(x){S.authErr="Sign-in isn’t available in this browser.";render()}
});
setInterval(()=>{if(!S.drag&&S.user&&S.tab==="map"&&!DEV.on)render()},5000);

 if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
